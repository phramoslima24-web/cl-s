modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
description='''
${mod_description}

Cla Namikaze: nasce com o Hiraishin no Jutsu e uma Kunai Hiraishin.
Cla Otsutsuki: chakra quase ilimitado, Byakugan, Rinnegan, Tenseigan, Jogan,
voo, viagem dimensional, absorcao de jutsus, Karma e Fruto de Chakra.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="narutoto"
    mandatory=true
    versionRange="[0.4,)"
    ordering="AFTER"
    side="BOTH"
